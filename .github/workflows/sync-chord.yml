name: Auto-sync Chord

on:
  schedule:
    # Sabtu 07:00 WIB (00:00 UTC) dan Selasa 19:00 WIB (12:00 UTC)
    - cron: "0 0 * * 6"
    - cron: "0 12 * * 2"
  workflow_dispatch:
    inputs:
      scraper:
        description: 'Pilih scraper'
        required: true
        default: 'psalmnote'
        type: choice
        options:
          - psalmnote
          - jrchord
          - both

jobs:
  scrape:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r scraper/requirements.txt

      - name: Scrape JRChord
        if: ${{ github.event.inputs.scraper == 'jrchord' || github.event.inputs.scraper == 'both' || github.event_name == 'schedule' }}
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}
        run: python -u scraper/scrape.py

      - name: Scrape Psalmnote
        if: ${{ github.event.inputs.scraper == 'psalmnote' || github.event.inputs.scraper == 'both' || github.event_name == 'schedule' }}
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}
        run: python -u scraper/scrape_psalmnote.py
