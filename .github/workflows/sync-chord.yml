name: Auto-sync Chord

on:
  schedule:
    # 07:00 WIB (00:00 UTC) dan 17:00 WIB (10:00 UTC)
    - cron: "0 0 * * *"
    - cron: "0 10 * * *"
  workflow_dispatch: # tombol manual di GitHub

jobs:
  scrape:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r scraper/requirements.txt

      - name: Scrape JRChord
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}
        run: python -u scraper/scrape.py

      - name: Scrape Psalmnote
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}
        run: python -u scraper/scrape_psalmnote.py
